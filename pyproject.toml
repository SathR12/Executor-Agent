[project]
name = "executor-agent"
version = "0.1.0"
description = "A Gemini coding agent with Docker-isolated execution and MCP tools"
readme = "README.md"
authors = [
    { name = "Sathya", email = "sathya_regu@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-genai>=3.3.0",
    "mcp[cli]>=2.3.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
executor-agent = "executor_agent:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
line-ending = "lf"

[dependency-groups]
dev = [
    "ruff>=0.17.5",
]
